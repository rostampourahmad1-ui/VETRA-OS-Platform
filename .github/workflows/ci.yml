name: VETRA OS CI

on:
  push:
    branches: [main, "feat/*"]
  pull_request:
    branches: [main, "feat/*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vetra
          POSTGRES_PASSWORD: vetra
          POSTGRES_DB: vetra_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vetra -d vetra_ci"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://vetra:vetra@localhost:5432/vetra_ci
      DATABASE_TEST_APP_URL: postgresql://vetra_app:vetra_app@localhost:5432/vetra_ci
      PORT: 5000
      CLERK_PUBLISHABLE_KEY: pk_test_placeholder
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Security Audit (dependencies)
        run: pnpm audit --audit-level=critical

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Bootstrap database roles
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/db/init/01-roles.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "ALTER ROLE vetra_app WITH PASSWORD '"'"'vetra_app'"'"'"
      - name: Apply database migrations
        run: |
          for migration in lib/db/drizzle/0000_nervous_mathemanic.sql lib/db/drizzle/0001_phase3.sql lib/db/drizzle/0002_quality.sql lib/db/drizzle/0003_tenant_isolation.sql lib/db/drizzle/0004_audit_rls.sql lib/db/drizzle/0005_db_roles.sql lib/db/drizzle/0006_forms.sql lib/db/drizzle/0007_workflow_hardening.sql lib/db/drizzle/0008_request_scoped_rls.sql lib/db/drizzle/0009_quality_lifecycle.sql lib/db/drizzle/0010_planning_wbs.sql; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Test
        run: pnpm test

  docker-build:
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Build API Server Docker Image
        run: docker build -t vetra-api-server -f artifacts/api-server/Dockerfile .

      - name: Build Frontend Docker Image
        run: docker build -t vetra-frontend -f artifacts/vetra/Dockerfile . || echo "Frontend Dockerfile not ready yet \u2014 skipping"
