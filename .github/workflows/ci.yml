name: VETRA OS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vetra
          POSTGRES_PASSWORD: vetra
          POSTGRES_DB: vetra_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vetra -d vetra_ci"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://vetra:vetra@localhost:5432/vetra_ci
      PORT: 5000
      CLERK_PUBLISHABLE_KEY: pk_test_placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Security Audit (dependencies)
        run: pnpm audit --audit-level=critical

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  docker-build:
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build API Server Docker Image
        run: docker build -t vetra-api-server -f artifacts/api-server/Dockerfile .

      - name: Build Frontend Docker Image
        run: docker build -t vetra-frontend -f artifacts/vetra/Dockerfile . || echo "Frontend Dockerfile not ready yet — skipping"
