name: VETRA OS CI

on:
  push:
    branches: [main, "feat/*"]
  pull_request:
    branches: [main, "feat/*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vetra
          POSTGRES_PASSWORD: vetra
          POSTGRES_DB: vetra_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vetra -d vetra_ci"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://vetra:vetra@localhost:5432/vetra_ci
      DATABASE_TEST_APP_URL: postgresql://vetra_app:vetra_app@localhost:5432/vetra_ci
      PORT: 5000
      CLERK_PUBLISHABLE_KEY: pk_test_placeholder
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Security Audit (dependencies)
        run: pnpm audit --audit-level=critical

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Bootstrap database roles
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/db/init/01-roles.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "ALTER ROLE vetra_app WITH PASSWORD 'vetra_app'"
      - name: Apply database migrations
        run: pnpm db:migrate
      - name: PostgreSQL RLS integration tests
        run: pnpm exec vitest run tests/security/rls-integration.test.ts --reporter=verbose
      - name: Test
        run: pnpm test

  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run security unit tests
        run: pnpm vitest run tests/security/ --reporter=verbose

      - name: Full dependency audit
        run: pnpm audit --audit-level=high

      - name: Summary
        run: echo "Security scan completed."

  docker-build:
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Build API Server Docker Image
        run: docker build -t vetra-api-server -f artifacts/api-server/Dockerfile .

      - name: Build Frontend Docker Image
        run: docker build -t vetra-frontend -f artifacts/vetra/Dockerfile .
