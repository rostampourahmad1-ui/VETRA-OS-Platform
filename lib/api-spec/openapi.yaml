components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    # ─── Dashboard Schemas ────────────────────────────────────────────────────
    DashboardSummary:
      type: object
      required:
        - activeProjects
        - totalBudget
        - spentBudget
        - overallProgress
        - delayedActivities
        - totalWorkforce
        - pendingApprovals
        - equipmentActive
        - equipmentTotal
        - openTasks
        - overdueTasksCount
      properties:
        activeProjects: { type: integer }
        totalBudget: { type: number }
        spentBudget: { type: number }
        overallProgress: { type: number }
        delayedActivities: { type: integer }
        totalWorkforce: { type: integer }
        pendingApprovals: { type: integer }
        equipmentActive: { type: integer }
        equipmentTotal: { type: integer }
        openTasks: { type: integer }
        overdueTasksCount: { type: integer }

    ProjectHealth:
      type: object
      required:
        - projectId
        - projectName
        - progress
        - status
        - health
        - budgetUsed
        - budgetTotal
        - daysRemaining
      properties:
        projectId: { type: integer }
        projectName: { type: string }
        progress: { type: number }
        status: { type: string }
        health: { type: string }
        budgetUsed: { type: number }
        budgetTotal: { type: number }
        daysRemaining: { type: integer }

    ActivityItem:
      type: object
      required:
        - id
        - type
        - description
        - user
        - createdAt
      properties:
        id: { type: integer }
        type: { type: string }
        description: { type: string }
        user: { type: string }
        projectName: { type: ["string", "null"] }
        createdAt: { type: string }

    CashFlowEntry:
      type: object
      required:
        - month
        - income
        - expense
      properties:
        month: { type: string }
        income: { type: number }
        expense: { type: number }

    # ─── Project Schemas ──────────────────────────────────────────────────────
    Project:
      type: object
      required:
        - id
        - name
        - status
        - progress
        - budget
        - spent
        - client
        - location
        - startDate
        - endDate
        - managerId
        - managerName
        - organizationId
        - createdAt
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: ["string", "null"] }
        status: { type: string }
        progress: { type: number }
        budget: { type: number }
        spent: { type: number }
        client: { type: string }
        location: { type: string }
        startDate: { type: string }
        endDate: { type: string }
        managerId: { type: integer }
        managerName: { type: string }
        organizationId: { type: integer }
        priority: { type: string }
        phase: { type: ["string", "null"] }
        createdAt: { type: string }

    ProjectInput:
      type: object
      required:
        - name
        - client
        - location
        - startDate
        - endDate
        - budget
        - managerId
        - organizationId
      properties:
        name: { type: string }
        description: { type: string }
        client: { type: string }
        location: { type: string }
        startDate: { type: string }
        endDate: { type: string }
        budget: { type: number }
        managerId: { type: integer }
        organizationId: { type: integer }
        priority: { type: string }
        phase: { type: string }
        status: { type: string }

    ProjectUpdate:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        status: { type: string }
        progress: { type: number }
        budget: { type: number }
        spent: { type: number }
        client: { type: string }
        location: { type: string }
        startDate: { type: string }
        endDate: { type: string }
        managerId: { type: integer }
        priority: { type: string }
        phase: { type: string }

    ProjectStats:
      type: object
      required:
        - taskCount
        - completedTasks
        - openTasks
        - documentCount
        - contractCount
        - meetingCount
        - reportCount
        - equipmentCount
      properties:
        taskCount: { type: integer }
        completedTasks: { type: integer }
        openTasks: { type: integer }
        documentCount: { type: integer }
