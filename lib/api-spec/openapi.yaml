openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: VETRA Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Dashboard and executive summaries
  - name: projects
    description: Project management
  - name: tasks
    description: Task management
  - name: documents
    description: Document management
  - name: contracts
    description: Contract management
  - name: daily-reports
    description: Daily site reports
  - name: meetings
    description: Meeting management
  - name: users
    description: User management
  - name: equipment
    description: Equipment tracking
  - name: inventory
    description: Inventory management
  - name: procurement
    description: Procurement orders
  - name: notifications
    description: Notification management
  - name: organizations
    description: Organization management
  - name: phase2
    description: Phase 2 workspace, finance, CRM and reporting operations

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── Dashboard ───────────────────────────────────────────────────────────────
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Executive dashboard summary
      responses:
        "200":
          description: Dashboard KPI summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/project-health:
    get:
      operationId: getDashboardProjectHealth
      tags: [dashboard]
      summary: Project health overview
      responses:
        "200":
          description: List of project health entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectHealth"

  /dashboard/recent-activity:
    get:
      operationId: getDashboardRecentActivity
      tags: [dashboard]
      summary: Recent activity feed
      responses:
        "200":
          description: List of recent activity items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /dashboard/cash-flow:
    get:
      operationId: getDashboardCashFlow
      tags: [dashboard]
      summary: Cash flow data for chart
      responses:
        "200":
          description: Monthly cash flow
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CashFlowEntry"

  # ─── Projects ────────────────────────────────────────────────────────────────
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List all projects
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /projects/{id}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get project by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Not found
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /projects/{id}/stats:
    get:
      operationId: getProjectStats
      tags: [projects]
      summary: Get project statistics
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Project stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectStats"

  # ─── Tasks ────────────────────────────────────────────────────────────────────
  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List tasks
      parameters:
        - name: projectId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
        - name: assigneeId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Create a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /tasks/{id}:
    get:
      operationId: getTask
      tags: [tasks]
      summary: Get task by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Update a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
    delete:
      operationId: deleteTask
      tags: [tasks]
      summary: Delete a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /tasks/summary:
    get:
      operationId: getTasksSummary
      tags: [tasks]
      summary: Tasks summary by status
      responses:
        "200":
          description: Tasks summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TasksSummary"

  # ─── Documents ───────────────────────────────────────────────────────────────
  /documents:
    get:
      operationId: listDocuments
      tags: [documents]
      summary: List documents
      parameters:
        - name: projectId
          in: query
          schema:
            type: integer
        - name: type
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"
    post:
      operationId: createDocument
      tags: [documents]
      summary: Add a document record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentInput"
      responses:
        "201":
          description: Created document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"

  /documents/{id}:
    delete:
      operationId: deleteDocument
      tags: [documents]
      summary: Delete a document
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── Contracts ───────────────────────────────────────────────────────────────
  /contracts:
    get:
      operationId: listContracts
      tags: [contracts]
      summary: List contracts
      parameters:
        - name: projectId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of contracts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Contract"
    post:
      operationId: createContract
      tags: [contracts]
      summary: Create a contract
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractInput"
      responses:
        "201":
          description: Created contract
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contract"

  /contracts/{id}:
    get:
      operationId: getContract
      tags: [contracts]
      summary: Get contract by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Contract
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contract"
    patch:
      operationId: updateContract
      tags: [contracts]
      summary: Update a contract
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractUpdate"
      responses:
        "200":
          description: Updated contract
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contract"

  # ─── Daily Reports ────────────────────────────────────────────────────────────
  /daily-reports:
    get:
      operationId: listDailyReports
      tags: [daily-reports]
      summary: List daily reports
      parameters:
        - name: projectId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of daily reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DailyReport"
    post:
      operationId: createDailyReport
      tags: [daily-reports]
      summary: Create a daily report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DailyReportInput"
      responses:
        "201":
          description: Created daily report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyReport"

  /daily-reports/{id}:
    get:
      operationId: getDailyReport
      tags: [daily-reports]
      summary: Get daily report by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Daily report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyReport"

  # ─── Meetings ────────────────────────────────────────────────────────────────
  /meetings:
    get:
      operationId: listMeetings
      tags: [meetings]
      summary: List meetings
      parameters:
        - name: projectId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of meetings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Meeting"
    post:
      operationId: createMeeting
      tags: [meetings]
      summary: Create a meeting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeetingInput"
      responses:
        "201":
          description: Created meeting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meeting"

  /meetings/{id}:
    get:
      operationId: getMeeting
      tags: [meetings]
      summary: Get meeting by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Meeting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meeting"
    patch:
      operationId: updateMeeting
      tags: [meetings]
      summary: Update a meeting
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeetingUpdate"
      responses:
        "200":
          description: Updated meeting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meeting"

  # ─── Users ───────────────────────────────────────────────────────────────────
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List users
      parameters:
        - name: role
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get user by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  # ─── Equipment ───────────────────────────────────────────────────────────────
  /equipment:
    get:
      operationId: listEquipment
      tags: [equipment]
      summary: List equipment
      parameters:
        - name: projectId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of equipment
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Equipment"
    post:
      operationId: createEquipment
      tags: [equipment]
      summary: Add equipment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EquipmentInput"
      responses:
        "201":
          description: Created equipment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Equipment"

  /equipment/{id}:
    patch:
      operationId: updateEquipment
      tags: [equipment]
      summary: Update equipment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EquipmentUpdate"
      responses:
        "200":
          description: Updated equipment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Equipment"

  # ─── Inventory ───────────────────────────────────────────────────────────────
  /inventory:
    get:
      operationId: listInventory
      tags: [inventory]
      summary: List inventory items
      parameters:
        - name: projectId
          in: query
          schema:
            type: integer
        - name: category
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of inventory items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryItem"
    post:
      operationId: createInventoryItem
      tags: [inventory]
      summary: Add inventory item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryItemInput"
      responses:
        "201":
          description: Created inventory item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"

  /inventory/{id}:
    patch:
      operationId: updateInventoryItem
      tags: [inventory]
      summary: Update inventory item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryItemUpdate"
      responses:
        "200":
          description: Updated inventory item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"

  # ─── Procurement ─────────────────────────────────────────────────────────────
  /procurement:
    get:
      operationId: listProcurementOrders
      tags: [procurement]
      summary: List procurement orders
      parameters:
        - name: projectId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of procurement orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProcurementOrder"
    post:
      operationId: createProcurementOrder
      tags: [procurement]
      summary: Create procurement order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcurementOrderInput"
      responses:
        "201":
          description: Created procurement order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcurementOrder"

  /procurement/{id}:
    patch:
      operationId: updateProcurementOrder
      tags: [procurement]
      summary: Update procurement order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcurementOrderUpdate"
      responses:
        "200":
          description: Updated procurement order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcurementOrder"

  # ─── Notifications ───────────────────────────────────────────────────────────
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List notifications
      responses:
        "200":
          description: List of notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"

  /notifications/{id}/read:
    patch:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"

  # ─── Organizations ───────────────────────────────────────────────────────────
  /organizations:
    get:
      operationId: listOrganizations
      tags: [organizations]
      summary: List organizations
      responses:
        "200":
          description: List of organizations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Organization"

  /workspaces:
    get:
      operationId: listWorkspaces
      tags: [phase2]
      summary: List role-based workspaces
      responses:
        "200":
          description: Available workspaces
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Workspace" } }
  /workspaces/{role}:
    get:
      operationId: getWorkspaceDashboard
      tags: [phase2]
      parameters:
        - { name: role, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Role dashboard
          content:
            application/json: { schema: { $ref: "#/components/schemas/WorkspaceDashboard" } }
  /cost-control/summary:
    get:
      operationId: getCostControlSummary
      tags: [phase2]
      parameters:
        - { name: projectId, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Cost control summary
          content:
            application/json: { schema: { $ref: "#/components/schemas/CostControlSummary" } }
  /cost-control/categories:
    get:
      operationId: listExpenseCategories
      tags: [phase2]
      responses: { "200": { description: Expense categories, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ExpenseCategory" } } } } } }
    post:
      operationId: createExpenseCategory
      tags: [phase2]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ExpenseCategoryInput" } } } }
      responses: { "201": { description: Created category, content: { application/json: { schema: { $ref: "#/components/schemas/ExpenseCategory" } } } } }
  /cost-control/budgets:
    get:
      operationId: listBudgets
      tags: [phase2]
      responses: { "200": { description: Budgets, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Budget" } } } } } }
    post:
      operationId: createBudget
      tags: [phase2]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/BudgetInput" } } } }
      responses: { "201": { description: Created budget, content: { application/json: { schema: { $ref: "#/components/schemas/Budget" } } } } }
  /cost-control/expenses:
    get:
      operationId: listExpenses
      tags: [phase2]
      responses: { "200": { description: Expenses, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Expense" } } } } } }
    post:
      operationId: createExpense
      tags: [phase2]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ExpenseInput" } } } }
      responses: { "201": { description: Created expense, content: { application/json: { schema: { $ref: "#/components/schemas/Expense" } } } } }
  /search:
    get:
      operationId: globalSearch
      tags: [phase2]
      parameters: [ { name: q, in: query, required: true, schema: { type: string, minLength: 2 } } ]
      responses: { "200": { description: Search results, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/SearchResult" } } } } } }
  /crm/clients:
    get:
      operationId: listClients
      tags: [phase2]
      parameters: [ { name: search, in: query, schema: { type: string } } ]
      responses: { "200": { description: Clients, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Client" } } } } } }
    post:
      operationId: createClient
      tags: [phase2]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ClientInput" } } } }
      responses: { "201": { description: Created client, content: { application/json: { schema: { $ref: "#/components/schemas/Client" } } } } }
  /crm/clients/{id}:
    get:
      operationId: getClient
      tags: [phase2]
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      responses: { "200": { description: Client, content: { application/json: { schema: { $ref: "#/components/schemas/Client" } } } } }
  /settings/profile:
    get:
      operationId: getProfile
      tags: [phase2]
      responses: { "200": { description: Profile, content: { application/json: { schema: { $ref: "#/components/schemas/UserProfile" } } } } }
    patch:
      operationId: updateProfile
      tags: [phase2]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ProfileUpdate" } } } }
      responses: { "200": { description: Updated profile, content: { application/json: { schema: { $ref: "#/components/schemas/UserProfile" } } } } }
  /settings/organization:
    get:
      operationId: getOrganizationSettings
      tags: [phase2]
      responses: { "200": { description: Organization settings, content: { application/json: { schema: { $ref: "#/components/schemas/Organization" } } } } }
  /settings/preferences:
    patch:
      operationId: updatePreferences
      tags: [phase2]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
      responses: { "200": { description: Preferences, content: { application/json: { schema: { type: object, additionalProperties: true } } } } }
  /reports/summary:
    get:
      operationId: getReportsSummary
      tags: [phase2]
      responses: { "200": { description: Summary report, content: { application/json: { schema: { $ref: "#/components/schemas/ReportsSummary" } } } } }

  /projects/{projectId}/timeline:
    get:
      summary: Get project Gantt timeline
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Project phases and milestones
  /projects/{projectId}/phases:
    post:
      summary: Create a project phase
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PhaseInput' }
      responses:
        '201': { description: Created }
  /projects/{projectId}/milestones:
    post:
      summary: Create a project milestone
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MilestoneInput' }
      responses:
        '201': { description: Created }
  /workflows:
    get:
      summary: List tenant workflows
      responses: { '200': { description: OK } }
    post:
      summary: Define an approval workflow
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkflowInput' }
      responses: { '201': { description: Created } }
  /workflows/{id}/runs:
    post:
      summary: Start an approval workflow
      responses: { '201': { description: Created } }
  /workflow-runs/{id}/decision:
    post:
      summary: Approve or reject the current workflow step
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [decision], properties: { decision: { type: string, enum: [approve, reject] } } }
      responses: { '200': { description: Updated workflow run } }
  /documents/upload:
    post:
      summary: Upload a document to local storage
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/DocumentUpload' }
      responses: { '201': { description: Uploaded document } }
  /ai/assistant:
    post:
      summary: Ask the VETRA AI assistant
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [query], properties: { query: { type: string } } }
      responses: { '200': { description: Assistant answer } }

