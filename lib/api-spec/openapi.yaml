openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: VETRA Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Dashboard and executive summaries
  - name: projects
    description: Project management
  - name: tasks
    description: Task management
  - name: documents
    description: Document management
  - name: contracts
    description: Contract management
  - name: daily-reports
    description: Daily site reports
  - name: meetings
    description: Meeting management
  - name: users
    description: User management
  - name: equipment
    description: Equipment tracking
  - name: inventory
    description: Inventory management
  - name: procurement
    description: Procurement orders
  - name: notifications
    description: Notification management
  - name: organizations
    description: Organization management

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── Dashboard ───────────────────────────────────────────────────────────────
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Executive dashboard summary
      responses:
        "200":
          description: Dashboard KPI summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/project-health:
    get:
      operationId: getDashboardProjectHealth
      tags: [dashboard]
      summary: Project health overview
      responses:
        "200":
          description: List of project health entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectHealth"

  /dashboard/recent-activity:
    get:
      operationId: getDashboardRecentActivity
      tags: [dashboard]
      summary: Recent activity feed
      responses:
        "200":
          description: List of recent activity items
          content:
