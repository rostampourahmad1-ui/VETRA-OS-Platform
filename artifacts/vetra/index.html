<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>VETRA Platform</title>
    <meta name="description" content="VETRA Platform — سامانه مدیریت پروژه‌های ساختمانی" />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="VETRA Platform" />
    <meta property="og:description" content="VETRA Platform — سامانه مدیریت پروژه‌های ساختمانی" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="VETRA Platform" />
    <meta name="twitter:description" content="VETRA Platform — سامانه مدیریت پروژه‌های ساختمانی" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem('vetra-theme');
          // Legacy migration: comfort → gray
          if (stored === 'comfort') stored = 'gray';
          var theme = stored === 'gray' || stored === 'dark' ? stored : 'light';
          var root = document.documentElement;
          root.dataset.theme = theme;
          if (theme === 'dark') root.classList.add('dark');
          root.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
