 ;; ============================================================================
 ;; VETRA OS — PgBouncer Configuration (Transaction Pooling)
 ;; ============================================================================
 ;; This file is mounted read-only into the PgBouncer container.
 ;; The edoburu/pgbouncer image uses environment variables for most settings,
 ;; but this file provides explicit overrides for production hardening.
 ;; ============================================================================
 
 [pgbouncer]
 
 ;; ─── Connection ───────────────────────────────────────────────────────────
 listen_addr = 0.0.0.0
 listen_port = 6432
 unix_socket_dir =
 
 ;; ─── Authentication ───────────────────────────────────────────────────────
 auth_type = scram-sha-256
 auth_file = /etc/pgbouncer/userlist.txt
 
 ;; ─── Pooling ──────────────────────────────────────────────────────────────
 pool_mode = transaction
 max_client_conn = 100
 default_pool_size = 20
 reserve_pool_size = 5
 reserve_pool_timeout = 3
 max_db_connections = 50
 max_user_connections = 50
 server_reset_query = DISCARD ALL
 
 ;; ─── Timeouts ─────────────────────────────────────────────────────────────
 client_idle_timeout = 0
 idle_transaction_timeout = 0
 server_idle_timeout = 600
 server_lifetime = 3600
 server_connect_timeout = 15
 query_timeout = 0
 query_wait_timeout = 120
 
 ;; ─── Logging ──────────────────────────────────────────────────────────────
 log_connections = 1
 log_disconnections = 1
 verbose = 0
 stats_period = 60
 
 ;; ─── Security ─────────────────────────────────────────────────────────────
 ;; Disable PgBouncer online admin console in production
 admin_users = vetra_admin
 ;; In production, set stats_user instead of exposing stats to all
 ;; stats_users = vetra_admin
 
 ;; ─── Databases ────────────────────────────────────────────────────────────
 [databases]
 ;; The application connects to this database via PgBouncer.
 ;; auth_user is the PgBouncer-level credential; the actual PostgreSQL
 ;; connection uses the DB_USER/DB_PASSWORD from the environment.
 vetra_dev = host=postgres port=5432 dbname=vetra_dev
 
 ;; ─── Users ────────────────────────────────────────────────────────────────
 [users]
 ;; User credentials are in the userlist.txt file (not tracked in Git).
 ;; Set via PgBouncer environment variables: AUTH_USER, AUTH_PASSWORD.
